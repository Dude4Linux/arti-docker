x-security-hardened: &security-hardened
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-logging: &default-logging
  driver: "${LOG_DRIVER:-none}"

x-client-deploy: &client-deploy
  resources:
    limits:
      cpus: '1.0'
      memory: 512M
      pids: 100
    reservations:
      memory: 256M

services:
  arti:
    build:
      context: .
      args:
        VERSION: "${ARTI_VERSION:-latest}"
    platform: "${PLATFORM:-linux/amd64}"
    <<: *security-hardened
    logging: *default-logging
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SOCKS_PORT:-9150}:${SOCKS_PORT:-9150}"
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8118}:${HTTP_PORT:-8118}"
    environment:
      - SOCKS_PORT=${SOCKS_PORT:-9150}
      - HTTP_PORT=${HTTP_PORT:-8118}
    read_only: true
    tmpfs:
      - /tmp:size=10m,mode=1777
    volumes:
      - arti-cache:/var/cache/arti
      - arti-state:/var/lib/arti
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 320M
          pids: 150
    networks:
      - proxy-net
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe"]
      start_period: 3m
      start_interval: 30s
      interval: 5m
      timeout: 20s
      retries: 3
    restart: unless-stopped

volumes:
  arti-cache:
  arti-state:

networks:
  proxy-net:
    driver: bridge
    # internal: false (default) — Arti needs direct internet access to reach
    # Tor relays.  When integrating with another stack (e.g. Amass), remove
    # this block and declare proxy-net as an external network instead:
    #   proxy-net:
    #     external: true
