x-security-hardened: &security-hardened
  cap_drop: [ALL]
  cap_add: [DAC_OVERRIDE]
  security_opt: [no-new-privileges:true]

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-client-deploy: &client-deploy
  resources:
    limits:
      cpus: '1.0'
      memory: 512M
      pids: 100
    reservations:
      memory: 256M

services:
  arti:
    build:
      context: .
      args:
        VERSION: "${ARTI_VERSION:-latest}"
    platform: "${PLATFORM:-linux/amd64}"
    <<: *security-hardened
    logging: *default-logging
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SOCKS_PORT:-9150}:${SOCKS_PORT:-9150}"
    environment:
      - SOCKS_PORT=${SOCKS_PORT:-9150}
    volumes:
      - arti-cache:/var/cache/arti
      - arti-state:/var/lib/arti
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 100
    healthcheck:
      test: ["CMD-SHELL", "curl --socks5-hostname 127.0.0.1:$$SOCKS_PORT --max-time 15 -sf https://check.torproject.org/api/ip"]
      start_period: 3m
      start_interval: 30s
      interval: 5m
      timeout: 20s
      retries: 3
    restart: unless-stopped

  privoxy:
    build:
      context: .
      dockerfile: docker/Dockerfile.privoxy
    profiles: [http-proxy]
    <<: *security-hardened
    logging: *default-logging
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8118}:${HTTP_PORT:-8118}"
    environment:
      - HTTP_PORT=${HTTP_PORT:-8118}
      - SOCKS_PORT=${SOCKS_PORT:-9150}
    depends_on:
      arti:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
          pids: 50
    healthcheck:
      test: ["CMD-SHELL", "curl --proxy http://127.0.0.1:$$HTTP_PORT --max-time 15 -sf https://check.torproject.org/api/ip"]
      start_period: 30s
      start_interval: 10s
      interval: 5m
      timeout: 20s
      retries: 3
    restart: unless-stopped

volumes:
  arti-cache:
  arti-state:
