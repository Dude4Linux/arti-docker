services:
  arti:
    build:
      context: .
      args:
        VERSION: "${ARTI_VERSION:-latest}"
    platform: "${PLATFORM:-linux/amd64}"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SOCKS_PORT:-9150}:${SOCKS_PORT:-9150}"
    environment:
      - SOCKS_PORT=${SOCKS_PORT:-9150}
    volumes:
      - arti-cache:/var/cache/arti
      - arti-state:/var/lib/arti
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    healthcheck:
      test: ["CMD-SHELL", "curl --socks5-hostname 127.0.0.1:$$SOCKS_PORT --max-time 15 -sf https://check.torproject.org/api/ip"]
      start_period: 3m
      start_interval: 30s
      interval: 5m
      timeout: 20s
      retries: 3
    restart: unless-stopped

  privoxy:
    build:
      context: .
      dockerfile: docker/Dockerfile.privoxy
    profiles: [http-proxy]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8118}:${HTTP_PORT:-8118}"
    environment:
      - HTTP_PORT=${HTTP_PORT:-8118}
      - SOCKS_PORT=${SOCKS_PORT:-9150}
    depends_on:
      arti:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --proxy http://127.0.0.1:$$HTTP_PORT --max-time 15 -sf https://check.torproject.org/api/ip"]
      start_period: 30s
      start_interval: 10s
      interval: 5m
      timeout: 20s
      retries: 3
    restart: unless-stopped

volumes:
  arti-cache:
  arti-state:
